services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Replica set satu node: wajib untuk transaksi MongoDB (impor Excel disimpan seluruhnya atau tidak sama sekali).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 10s
      start_period: 30s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: https://${SITE_DOMAIN}
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads:
  caddy_data:
  caddy_config:
